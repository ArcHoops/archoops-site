<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ArcHoops Open Graph Preview</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #fbfaf8;
      color: #1a1a1a;
    }

    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      padding: 56px 72px;
      overflow: hidden;
    }

    .arc {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .arc path {
      fill: none;
      stroke: #f47816;
      stroke-width: 3;
      stroke-linecap: round;
      opacity: 0.14;
    }

    .logo {
      position: relative;
      z-index: 1;
      font-size: 42px;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 72px;
    }

    .logo-arc {
      color: #1a1a1a;
    }

    .logo-hoops {
      color: #f47816;
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 820px;
    }

    .kicker {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f47816;
      margin-bottom: 18px;
    }

    .headline {
      font-size: 72px;
      font-weight: 800;
      line-height: 0.98;
      letter-spacing: -0.03em;
      text-transform: uppercase;
    }

    .headline__accent {
      color: #f47816;
    }

    .trust {
      position: absolute;
      left: 72px;
      bottom: 56px;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 500;
      color: #6b7280;
    }

    .trust-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #e8f5ec;
      color: #1e8b3a;
      font-size: 16px;
      font-weight: 800;
    }

    .accent-dot {
      position: absolute;
      right: 88px;
      top: 72px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #f47816;
      opacity: 0.85;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="arc" viewBox="0 0 1200 630" aria-hidden="true">
      <path d="M -40 520 Q 420 80 1240 220" />
    </svg>

    <div class="accent-dot" aria-hidden="true"></div>

    <div class="logo">
      <span class="logo-arc">Arc</span><span class="logo-hoops">Hoops</span>
    </div>

    <div class="content">
      <p class="kicker">The next generation of</p>
      <h1 class="headline">
        Data science<br />
        starts with<br />
        <span class="headline__accent">game night.</span>
      </h1>
    </div>

    <p class="trust">
      <span class="trust-icon" aria-hidden="true">✓</span>
      Built for learners. Backed by educators.
    </p>
  </div>
</body>
</html>
